{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-card auth-card-wide">
  <div class="auth-header">
    <span class="auth-badge">Create Account</span>
    <h1>Register</h1>
    <p class="auth-subtitle">Set up your account with a strong password to get started.</p>
  </div>

  <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required autocomplete="username" placeholder="Choose a username">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required minlength="12" autocomplete="new-password" placeholder="At least 12 characters">
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password" placeholder="Repeat your password">
    </div>

    <div class="form-row">
      <span class="auth-hint">Use a strong password with at least 12 characters.</span>
      <a class="auth-link" href="{{ url_for('auth.login') }}">Back to login</a>
    </div>

    <button class="btn btn-primary auth-submit" type="submit">Create account</button>
  </form>
</div>
{% endblock %}
